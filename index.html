
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salon Reader</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;max-width:700px;margin:0 auto;padding:24px;line-height:1.6}
input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 12px;border:1px solid #ccc;border-radius:8px}
button{padding:10px 16px;margin:4px;border:1px solid #ccc;border-radius:8px;background:#fff}
button.primary{background:#111;color:#fff}
#status{margin-top:16px;padding:12px;background:#f5f5f5;border-radius:8px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h1>🎧 Salon Reader</h1>
<p class="small">記事本文だけを抽出して読み上げます。</p>
<input id="url" value="https://salon.jp/articles/nishino/s/5phcpAKoH7R">
<div>
<button class="primary" onclick="start()">▶ 再生</button>
<button onclick="stop()">■ 停止</button>
<button onclick="setRate(1)">1.0x</button>
<button onclick="setRate(1.2)">1.2x</button>
<button onclick="setRate(1.5)">1.5x</button>
<button onclick="setRate(1.8)">1.8x</button>
</div>
<div id="status">待機中</div>

<script>
let stopped=true, rate=1.2, currentUrl="";
const statusEl=document.getElementById("status");

function setRate(v){rate=v; statusEl.textContent="速度 "+v+"x";}

function cleanText(s){
  return s.replace(/\s+/g," ").replace(/[ \t]+([、。！？])/g,"$1").trim();
}

function extractArticle(doc){
  // Salon.jpの構造変化に備えて候補を複数試す
  const selectors=[
    "article",
    "[class*='article-body']",
    "[class*='articleBody']",
    "[class*='article_content']",
    "[class*='article-content']",
    "[class*='entry-content']",
    "main"
  ];
  let candidates=[];
  for(const sel of selectors){
    doc.querySelectorAll(sel).forEach(e=>candidates.push(e));
  }

  // 本文らしい要素をスコアリング
  let best=null,bestScore=0;
  for(const el of candidates){
    const clone=el.cloneNode(true);
    clone.querySelectorAll("script,style,noscript,nav,header,footer,form,button,svg,img,video,a[href]").forEach(x=>{
      // aはリンク文字だけ残すとURLは読まないが、ナビ等のリンクは後で除外
      if(x.tagName==="A"){
        const t=document.createTextNode(x.textContent||"");
        x.replaceWith(t);
      } else x.remove();
    });
    const text=cleanText(clone.innerText||"");
    const score=text.length + (el.querySelectorAll("p").length*200);
    if(score>bestScore){bestScore=score;best={el,text};}
  }

  if(!best || best.text.length<100){
    // 最後の手段：bodyから明らかなUIを削除
    const clone=doc.body.cloneNode(true);
    clone.querySelectorAll("script,style,noscript,nav,header,footer,form,button,input,select,textarea,aside,img,video,svg,a").forEach(x=>x.remove());
    return cleanText(clone.innerText||"");
  }
  return best.text;
}

function splitText(text,max=1800){
  const out=[];
  while(text.length>max){
    let cut=Math.max(
      text.lastIndexOf("。",max),
      text.lastIndexOf("！",max),
      text.lastIndexOf("？",max),
      text.lastIndexOf("\n",max)
    );
    if(cut<800) cut=max;
    out.push(text.slice(0,cut+1).trim());
    text=text.slice(cut+1).trim();
  }
  if(text) out.push(text);
  return out;
}

function speakChunks(chunks,i=0){
  if(stopped || i>=chunks.length){ if(!stopped) nextArticle(); return; }
  const u=new SpeechSynthesisUtterance(chunks[i]);
  u.lang="ja-JP"; u.rate=rate;
  u.onend=()=>speakChunks(chunks,i+1);
  u.onerror=()=>{ if(!stopped) statusEl.textContent="読み上げエラー"; };
  speechSynthesis.speak(u);
}

async function load(url){
  statusEl.textContent="記事を取得中…";
  try{
    const proxy="https://r.jina.ai/http://"+url.replace(/^https?:\/\//,"");
    const r=await fetch(proxy);
    if(!r.ok) throw new Error("取得失敗");
    const html=await r.text();
    const doc=new DOMParser().parseFromString(html,"text/html");
    const title=cleanText(doc.querySelector("h1")?.textContent||doc.title||"");
    const text=extractArticle(doc);
    if(text.length<100) throw new Error("本文が見つかりません");
    statusEl.textContent=(title?title+" / ":"")+"読み上げ中";
    speakChunks(splitText(text));
  }catch(e){
    statusEl.textContent="記事を取得できませんでした。Salon.jpのログインが必要な記事は、現在の方式では取得できない場合があります。";
  }
}

function start(){
  stop();
  stopped=false;
  currentUrl=document.getElementById("url").value.trim();
  if(!currentUrl) return;
  load(currentUrl);
}

function stop(){
  stopped=true;
  speechSynthesis.cancel();
  statusEl.textContent="停止";
}

function nextArticle(){
  // URL指定方式の試作では自動次記事はまだ限定的
  statusEl.textContent="この記事の読み上げが終了しました。";
}
</script>
</body>
</html>
