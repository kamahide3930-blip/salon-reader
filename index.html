<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salon Reader</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;max-width:700px;margin:0 auto;padding:24px;line-height:1.6}
input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 12px;border:1px solid #ccc;border-radius:8px}
button{padding:10px 16px;margin:4px;border:1px solid #ccc;border-radius:8px;background:#fff}
button.primary{background:#111;color:#fff}
#status{margin-top:16px;padding:12px;background:#f5f5f5;border-radius:8px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h1>🎧 Salon Reader</h1>
<p class="small">Salon.jpの記事本文だけを読み上げます。</p>
<input id="url" value="https://salon.jp/articles/nishino/s/5phcpAKoH7R">
<div>
<button class="primary" onclick="start()">▶ 再生</button>
<button onclick="stop()">■ 停止</button>
<button onclick="setRate(1)">1.0x</button>
<button onclick="setRate(1.2)">1.2x</button>
<button onclick="setRate(1.5)">1.5x</button>
<button onclick="setRate(1.8)">1.8x</button>
</div>
<div id="status">待機中</div>

<script>
let stopped=true, rate=1.2;
const statusEl=document.getElementById("status");

function setRate(v){rate=v; statusEl.textContent="速度 "+v+"x";}

function cleanArticleText(raw){
  let s=raw;

  // Markdownの画像・リンクを削除/文字だけ残す
  s=s.replace(/!\[[^\]]*\]\([^)]*\)/g,"");
  s=s.replace(/\[([^\]]+)\]\([^)]*\)/g,"$1");

  // HTMLタグが残っていた場合
  s=s.replace(/<[^>]*>/g," ");

  // URLそのものを削除
  s=s.replace(/https?:\/\/[^\s)\]]+/gi,"");

  // Markdown記号・引用記号など
  s=s.replace(/^#{1,6}\s*/gm,"");
  s=s.replace(/^\s*>\s?/gm,"");
  s=s.replace(/^\s*[-*+]\s+/gm,"");

  // Salon.jpのUI・ナビに出やすい行を除外
  const skip=[
    "ホーム","サロン記事","プレゼント","クーポン","チムニーマップ",
    "近くのストア","サロンメンバーを探す","使い方マニュアル",
    "お問合せ","プライバシーポリシー","利用規約",
    "特定商取引法に基づく表記","広告表現ガイドライン",
    "サロン記事一覧へ","オンラインサロン","サロン記事一覧",
    "検索したいワード","いいねした記事","新着記事","注目のタグ",
    "過去の記事","最新の記事をみるには","入会して最新の記事をみる"
  ];

  const lines=s.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const result=[];
  for(const line of lines){
    if(skip.some(x=>line===x)) continue;
    if(/^https?:\/\//i.test(line)) continue;
    if(/^(Image|Button|Input|Select)\b/i.test(line)) continue;
    if(/^\[[^\]]+\]\([^)]+\)$/.test(line)) continue;
    result.push(line);
  }

  // 連続空白を整理
  return result.join(" ")
    .replace(/\s+/g," ")
    .replace(/[ \t]+([、。！？])/g,"$1")
    .trim();
}

function extractArticle(markdown){
  // Jinaの取得結果では、記事タイトル→日付→本文→
  // 「最新の記事をみるには」の順になっている。
  const lines=markdown.split(/\n+/).map(x=>x.trim()).filter(Boolean);

  let start=-1;
  let end=lines.length;

  // 日付行を探す
  for(let i=0;i<lines.length;i++){
    if(/^\d{4}\.\d{2}\.\d{2}/.test(lines[i])){
      start=i+1;
      break;
    }
  }

  // 本文終了位置
  for(let i=(start>=0?start:0);i<lines.length;i++){
    if(lines[i].includes("最新の記事をみるには") ||
       lines[i].includes("入会して最新の記事をみる")){
      end=i;
      break;
    }
  }

  if(start<0){
    // フォールバック：タイトルの次から
    start=Math.max(0,lines.findIndex(x=>x.startsWith("# "))+1);
  }

  return cleanArticleText(lines.slice(start,end).join("\n"));
}

function splitText(text,max=1800){
  const out=[];
  while(text.length>max){
    let cut=Math.max(
      text.lastIndexOf("。",max),
      text.lastIndexOf("！",max),
      text.lastIndexOf("？",max)
    );
    if(cut<800) cut=max;
    out.push(text.slice(0,cut+1).trim());
    text=text.slice(cut+1).trim();
  }
  if(text) out.push(text);
  return out;
}

function speakChunks(chunks,i=0){
  if(stopped) return;
  if(i>=chunks.length){
    statusEl.textContent="この記事の読み上げが終了しました。";
    return;
  }
  const u=new SpeechSynthesisUtterance(chunks[i]);
  u.lang="ja-JP";
  u.rate=rate;
  u.onend=()=>speakChunks(chunks,i+1);
  u.onerror=()=>{if(!stopped)statusEl.textContent="読み上げエラー";};
  speechSynthesis.speak(u);
}

async function load(url){
  statusEl.textContent="記事を取得中…";
  try{
    const target=url.replace(/^https?:\/\//,"");
    const proxy="https://r.jina.ai/http://"+target;
    const r=await fetch(proxy);
    if(!r.ok) throw new Error("取得失敗");
    const markdown=await r.text();

    const text=extractArticle(markdown);
    if(text.length<100) throw new Error("本文が見つかりません");

    statusEl.textContent="読み上げ中";
    speakChunks(splitText(text));
  }catch(e){
    console.error(e);
    statusEl.textContent="記事を取得できませんでした。";
  }
}

function start(){
  speechSynthesis.cancel();
  stopped=false;
  const url=document.getElementById("url").value.trim();
  if(url) load(url);
}

function stop(){
  stopped=true;
  speechSynthesis.cancel();
  statusEl.textContent="停止";
}
</script>
</body>
</html>
